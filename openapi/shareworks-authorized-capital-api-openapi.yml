          type: boolean
          description: Approval status of the plan
        grants:
          type: array
          description: List of all grants under the plan
          items:
            $ref: '#/components/schemas/StakeholderGrantSummaryDetails'
    ErrorWithCode:
      title: Validation Error
      required:
      - code
      - message
      type: object
      properties:
        message:
          type: string
          description: Message describing the error
        code:
          type: integer
          description: Unique code for the validation error
          format: int32
    StakeholderGrantAcceleratedVestingDetails:
      title: Accelerated Vesting Response
      required:
      - accelerationPercent
      - accelerationPeriod
      - accelerationTrigger
      type: object
      properties:
        accelerationTrigger:
          type: string
          description: 'The name of the event that will trigger vesting acceleration: TERMINATION_WITHOUT_CAUSE, RESIGNATION_FOR_GOOD_REASON, or CHANGE_OF_CONTROL'
        accelerationPeriod:
          type: integer
          description: The number of months after the trigger event that vesting acceleration will occur (0 to 60). A value > 0 defines a double-trigger acceleration
          format: int32
        accelerationPercent:
          type: integer
          description: The percent of the unvested shares that will be accelerated (1 to 100)
          format: int32
      description: List of the vesting acceleration stipulations of the grant. May be empty.
    DesignatedSharesSummaryDetails:
      title: Class Designated Share Summary Response
      required:
      - totalAvailableShares
      - totalCommonStockEquivalentShares
      - totalOutstandingShares
      type: object
      properties:
        totalAvailableShares:
          type: number
          description: Total available shares across the stock designations for the class
          format: double
        totalOutstandingShares:
          type: number
          description: Total outstanding shares across the stock designations for the class
          format: double
        totalCommonStockEquivalentShares:
          type: number
          description: Total common equivalent (a.k.a. fully diluted) shares across the stock designations for the class
          format: double
      description: Summary of all shares across the stock designations for the class
    FundDetails:
      title: Fund Details Response
      type: object
      properties:
        fundName:
          type: string
          description: Full name of the fund
        fmv:
          type: number
          description: Fair market value of the fund
          format: double
        effectiveDate:
          type: string
          description: The effective date of the fund
          format: date
        expirationDate:
          type: string
          description: The expiration date of the fund
          format: date
    ClassOfSecuritiesDetails:
      title: Authorized Capital Class Detailed Response
      required:
      - classOfSecurities
      - stockDesignations
      - totalAuthorizedShares
      - totalCommonStockEquivalentShares
      - totalDesignatedShares
      - totalOutstandingShares
      type: object
      properties:
        classOfSecurities:
          type: string
          description: Whether the class is common or preferred stock
          enum:
          - COMMON
          - PREFERRED
          - COMMON_STOCK
          - PREFERRED_STOCK
        parValue:
          type: number
          description: Par value for the class of securities
          format: double
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the class of securities
          format: double
        totalDesignatedShares:
          type: number
          description: Total shares designated to one or more stock designations for the class
          format: double
        totalOutstandingShares:
          type: number
          description: Total outstanding shares from all stock designations for the class
          format: double
        totalCommonStockEquivalentShares:
          type: number
          description: Total fully diluted shares from all stock designations for the class
          format: double
        stockDesignations:
          type: array
          description: List of all stock designations for the class of securities
          items:
            $ref: '#/components/schemas/SecuritiesDesignationDetails'
    RestApiErrorResponse:
      title: Error Response
      required:
      - code
      - errorId
      - message
      type: object
      properties:
        code:
          type: string
          description: Code representing the type of error
        message:
          type: string
          description: Message describing the error
        errors:
          type: array
          description: List of all further error details, usually due to validation checks
          items:
            $ref: '#/components/schemas/ErrorWithCode'
        errorId:
          type: string
          description: Identifier for the error
    StakeholderGrantSummaryDetails:
