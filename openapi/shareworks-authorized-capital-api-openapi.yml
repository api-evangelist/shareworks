          description: List of all manual vesting rows for the grant, specified when using a manual vesting schedule
          items:
            $ref: '#/components/schemas/ManualVestingRowDetails'
        grantedShares:
          type: number
          description: Quantity of shares for the grant
          format: double
        cancelledShares:
          type: number
          description: Number of shares cancelled for the grant
          format: double
        exercisedShares:
          type: number
          description: Number of shares exercised for the grant
          format: double
        outstandingShares:
          type: number
          description: Number of shares outstanding for the grant
          format: double
        vestingAcceleration:
          type: array
          description: List of the vesting acceleration stipulations of the grant. May be empty.
          items:
            $ref: '#/components/schemas/StakeholderGrantAcceleratedVestingDetails'
      description: List of grants held by the stakeholder
    WarrantsSummaryDetails:
      title: Warrant Details Response
      required:
      - numberOfWarrants
      - percentageFullyDiluted
      - totalCommonStockEquivalentShares
      type: object
      properties:
        numberOfWarrants:
          type: integer
          description: Total number of warrants
          format: int32
        totalCommonStockEquivalentShares:
          type: number
          description: Total Common Stock Equivalent shares represented by warrants
          format: double
        percentageFullyDiluted:
          type: number
          description: Percentage of fully diluted shares outstanding across all warrants
          format: double
      description: Summary information on warrants for the company
    AuthorizedCapitalDetails:
      title: Authorized Capital Response
      required:
      - certificatedShares
      - classesOfSecurities
      - companyId
      - percentageOfFullyDilutedAvailableShares
      - percentageOfFullyDilutedOutstandingShares
      - plans
      - totalAuthorizedShares
      - totalCommonStockEquivalentShares
      - totalOutstandingShares
      - warrants
      type: object
      properties:
        companyId:
          type: integer
          description: Identifier for the company
          format: int32
        totalAuthorizedShares:
          type: number
          description: Total shares authorized across all types of securities
          format: double
        totalOutstandingShares:
          type: number
          description: Total outstanding shares across all types of securities
          format: double
        totalCommonStockEquivalentShares:
          type: number
          description: Total common equivalent (a.k.a. fully diluted) shares across all types of securities
          format: double
        percentageOfFullyDilutedOutstandingShares:
          type: number
          description: Percentage of fully diluted outstanding shares across all types of securities
          format: double
        percentageOfFullyDilutedAvailableShares:
          type: number
          description: Percentage of fully diluted available shares across all types of securities
          format: double
        currentFMV:
          type: number
          description: The fair market value for the company per share (usually the latest 409A valuation for private companies)
          format: double
        classesOfSecurities:
          type: array
          description: List of summary information for all classes of securities for the company
          items:
            $ref: '#/components/schemas/ClassOfSecuritiesSummaryDetails'
        warrants:
          $ref: '#/components/schemas/WarrantsSummaryDetails'
        plans:
          type: array
          description: List of summary information for all plans for the company
          items:
            $ref: '#/components/schemas/PlanSummaryDetails'
        certificatedShares:
          type: boolean
          description: Whether the stock certificates are paper (value 'false' indicates they are digital)
    ClassOfSecuritiesSummaryDetails:
      title: Class Summary Response
      required:
      - classOfSecurities
      - designationSummary
      - totalAuthorizedShares
      - totalAvailableToDesignate
      type: object
      properties:
        classOfSecurities:
          type: string
          description: Whether the class is common or preferred stock
          enum:
          - COMMON
          - PREFERRED
          - COMMON_STOCK
          - PREFERRED_STOCK
        parValue:
          type: number
          description: Par value for the class of securities
          format: double
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the class of securities
          format: double
        totalAvailableToDesignate:
          type: number
          description: Total shares remaining to designate to stock designations for the class
          format: double
        designationSummary:
          $ref: '#/components/schemas/DesignatedSharesSummaryDetails'
      description: List of summary information for all classes of securities for the company
