    StockFilingClassDetails:
      title: Stock Filing Class Response
      required:
      - classOfSecurities
      - designations
      - totalAuthorizedShares
      type: object
      properties:
        classOfSecurities:
          type: string
          description: Whether the class is common or preferred stock
          enum:
          - COMMON
          - PREFERRED
          - COMMON_STOCK
          - PREFERRED_STOCK
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the class of securities
          format: double
        designations:
          type: array
          description: List of all stock designations for the class of securities
          items:
            $ref: '#/components/schemas/StockFilingDesignationDetails'
      description: List of all classes of securities for the stock filing
    StakeholderGrantAcceleratedVestingDetails:
      title: Accelerated Vesting Response
      required:
      - accelerationPercent
      - accelerationPeriod
      - accelerationTrigger
      type: object
      properties:
        accelerationTrigger:
          type: string
          description: 'The name of the event that will trigger vesting acceleration: TERMINATION_WITHOUT_CAUSE, RESIGNATION_FOR_GOOD_REASON, or CHANGE_OF_CONTROL'
        accelerationPeriod:
          type: integer
          description: The number of months after the trigger event that vesting acceleration will occur (0 to 60). A value > 0 defines a double-trigger acceleration
          format: int32
        accelerationPercent:
          type: integer
          description: The percent of the unvested shares that will be accelerated (1 to 100)
          format: int32
      description: List of the vesting acceleration stipulations of the grant. May be empty.
    StockFilingDesignationDetails:
      title: Stock Filing Designation Response
      required:
      - convertible
      - parValue
      - stockDesignationId
      - stockDesignationName
      - totalAuthorizedShares
      type: object
      properties:
        stockDesignationId:
          type: integer
          description: Identifier for the stock designation
          format: int32
        stockDesignationName:
          type: string
          description: Name for the stock designation
        fundingRound:
          type: integer
          description: Funding round number for the stock designation
          format: int64
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the stock designation
          format: double
        parValue:
          type: number
          description: Par value for the stock designation
          format: double
        pricePerShare:
          type: number
          description: Price per share for the stock designation
          format: double
        convertible:
          type: boolean
          description: Whether the stock designation is convertible
        convertsToStockDesignationId:
          type: integer
          description: Identifier for the stock designation which the stock designation converts to
          format: int32
        conversionRatioAntecedent:
          type: number
          description: The antecedent of the conversion ratio. E.g. 2 for a 2:1 conversion (2 converted shares for each original share)
          format: double
        conversionRatioConsequent:
          type: number
          description: The consequent of the conversion ratio. E.g. 1 for a 2:1 conversion (2 converted shares for each original share)
          format: double
        rounding:
          type: string
          description: Rounding type used when converting shares from the stock designation
          enum:
          - NORMAL
          - UP
          - DOWN
      description: List of all stock designations for the class of securities
    ClassOfSecuritiesDetails:
      title: Authorized Capital Class Detailed Response
      required:
      - classOfSecurities
      - stockDesignations
      - totalAuthorizedShares
      - totalCommonStockEquivalentShares
      - totalDesignatedShares
      - totalOutstandingShares
      type: object
      properties:
        classOfSecurities:
          type: string
          description: Whether the class is common or preferred stock
          enum:
          - COMMON
          - PREFERRED
          - COMMON_STOCK
          - PREFERRED_STOCK
        parValue:
          type: number
          description: Par value for the class of securities
          format: double
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the class of securities
          format: double
        totalDesignatedShares:
          type: number
          description: Total shares designated to one or more stock designations for the class
          format: double
        totalOutstandingShares:
          type: number
          description: Total outstanding shares from all stock designations for the class
          format: double
        totalCommonStockEquivalentShares:
          type: number
          description: Total fully diluted shares from all stock designations for the class
          format: double
        stockDesignations:
          type: array
          description: List of all stock designations for the class of securities
          items:
            $ref: '#/components/schemas/SecuritiesDesignationDetails'
    RestApiErrorResponse:
      title: Error Response
      required:
      - code
      - errorId
      - message
      type: object
      properties:
        code:
          type: string
          description: Code representing the type of error
        message:
          type: string
          description: Message describing the error
        errors:
          type: array
          description: List of all further error details, usually due to validation checks
          items:
            $ref: '#/components/schemas/ErrorWithCode'
        errorId:
          type: string
          description: Identifier for the error
    ClassOfSecuritiesSummaryDetails:
      title: Class Summary Response
      required:
      - classOfSecurities
      - designationSummary
      - totalAuthorizedShares
      - totalAvailableToDesignate
      type: object
      properties:
        classOfSecurities:
          type: string
          description: Whether the class is common or preferred stock
          enum:
          - COMMON
          - PREFERRED
          - COMMON_STOCK
          - PREFERRED_STOCK
        parValue:
          type: number
          description: Par value for the class of securities
          format: double
        totalAuthorizedShares:
          type: number
          description: Total number of authorized shares for the class of securities
          format: double
        totalAvailableToDesignate:
          type: number
          description: Total shares remaining to designate to stock designations for the class
          format: double
        designationSummary:
          $ref: '#/components/schemas/DesignatedSharesSummaryDetails'
      description: List of summary information for all classes of securities for the company
    AuthorizedCapitalDetails:
      title: Authorized Capital Response
      required:
      - certificatedShares
      - classesOfSecurities
      - companyId
      - percentageOfFullyDilutedAvailableShares
      - percentageOfFullyDilutedOutstandingShares
      - plans
      - totalAuthorizedShares
      - totalCommonStockEquivalentShares
      - totalOutstandingShares
      - warrants
      type: object
      properties:
        companyId:
          type: integer
          description: Identifier for the company
          format: int32
        totalAuthorizedShares:
          type: number
          description: Total shares authorized across all types of securities
          format: double
        totalOutstandingShares:
          type: number
          description: Total outstanding shares across all types of securities
          format: double
        totalCommonStockEquivalentShares:
          type: number
          description: Total common equivalent (a.k.a. fully diluted) shares across all types of securities
          format: double
        percentageOfFullyDilutedOutstandingShares:
          type: number
          description: Percentage of fully diluted outstanding shares across all types of securities
          format: double
        percentageOfFullyDilutedAvailableShares:
          type: number
          description: Percentage of fully diluted available shares across all types of securities
          format: double
        currentFMV:
          type: number
          description: The fair market value for the company per share (usually the latest 409A valuation for private companies)
          format: double
        classesOfSecurities:
          type: array
          description: List of summary information for all classes of securities for the company
          items:
            $ref: '#/components/schemas/ClassOfSecuritiesSummaryDetails'
        warrants:
          $ref: '#/components/schemas/WarrantsSummaryDetails'
        plans:
          type: array
          description: List of summary information for all plans for the company
          items:
            $ref: '#/components/schemas/PlanSummaryDetails'
        certificatedShares:
          type: boolean
          description: Whether the stock certificates are paper (value 'false' indicates they are digital)
    VestingScheduleRowDetails:
      title: Vesting Schedule Row Response
      required:
      - amountDenominator
      - amountNumerator
      - vestingScheduleRowId
      type: object
      properties:
        vestingScheduleRowId:
          type: integer
          description: Identifier for the vesting row
          format: int32
        amountNumerator:
          type: integer
          description: Numerator of the vesting amount for the row/tranche
          format: int64
        amountDenominator:
          type: integer
          description: Denominator of the vesting amount for the row/tranche
          format: int64
        vestingPeriodLength:
          type: integer
          description: Number of periods between the row/tranche and the previous row/tranche (or vesting start date)
          format: int32
        vestingPeriodType:
          type: string
          description: Type of vesting period for the row/tranche
          enum:
          - YEAR
          - MONTH
          - WEEK
          - DAY
      description: List of all rows/tranches for the vesting schedule
    AccessTokenResponse:
      title: Token Response
      required:
      - accessToken
      - expiresIn
      - issuedAt
      - issuer
      - tokenType
      type: object
      properties:
        accessToken:
          type: string
          description: Token to accompany all API requests for authentication purposes
        expiresIn:
          type: integer
          description: Token expiry period in seconds
          format: int32
        scope:
          type: string
          description: Access scope for the token
        issuedAt:
          type: integer
          description: Issued instant for the token (Unix epoch time)
          format: int64
        issuer:
          type: string
          description: Issuer of the token
        audience:
          type: string
          description: Audience for the token
        tokenType:
          type: string
          description: Type of the token
    ManualVestingRowDetails:
      title: Manual Vesting Row Response
      required:
      - vestQuantity
      type: object
      properties:
        vestDate:
          type: string
          description: Date on which the vesting occurs for the row/tranche
          format: date
        vestQuantity:
          type: number
          description: Quantity of shares to vest for the row/tranche
          format: double
      description: List of all manual vesting rows for the grant, specified when using a manual vesting schedule
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
